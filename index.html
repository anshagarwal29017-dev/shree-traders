<!doctype html>
<html lang="en">
<head>

<title>SHREE TRADERS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout concept: navy ledger-book sidebar + white working surface; dense, numeric, desktop-first, collapses to a drawer on phones. */
:root {
  --navy: #13244d; --navy-2: #1c3470; --navy-ink: #c9d4ef; --navy-line: #2a3f78;
  --bg: #f3f5fa; --surface: #ffffff; --surface-2: #f7f9fd; --line: #e0e5f0; --line-2: #cfd7e8;
  --text: #15203b; --muted: #65718d; --accent: #2a55cf; --accent-ink: #ffffff; --accent-soft: #e6ecfc;
  --good: #11763f; --good-soft: #e0f3e8; --warn: #9a5b00; --warn-soft: #fdf0d8; --bad: #b3261e; --bad-soft: #fbe5e3;
  --c1: #2a55cf; --c2: #d98a1e; --c3: #1d8f8a; --shadow: 0 1px 2px rgba(19,36,77,.06), 0 4px 14px rgba(19,36,77,.05);
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --navy: #0a1230; --navy-2: #16255a; --navy-ink: #b9c6e6; --navy-line: #243564;
  --bg: #0c1325; --surface: #131c33; --surface-2: #17213b; --line: #243053; --line-2: #31406b;
  --text: #e5eaf7; --muted: #93a0c0; --accent: #7b9bff; --accent-ink: #0b1430; --accent-soft: #1c2a55;
  --good: #52c98a; --good-soft: #14352a; --warn: #f0b457; --warn-soft: #3a2d12; --bad: #ff8a80; --bad-soft: #3d1b1a;
  --c1: #7b9bff; --c2: #f0b457; --c3: #4fc9c2; --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --navy: #0a1230; --navy-2: #16255a; --navy-ink: #b9c6e6; --navy-line: #243564;
  --bg: #0c1325; --surface: #131c33; --surface-2: #17213b; --line: #243053; --line-2: #31406b;
  --text: #e5eaf7; --muted: #93a0c0; --accent: #7b9bff; --accent-ink: #0b1430; --accent-soft: #1c2a55;
  --good: #52c98a; --good-soft: #14352a; --warn: #f0b457; --warn-soft: #3a2d12; --bad: #ff8a80; --bad-soft: #3d1b1a;
  --c1: #7b9bff; --c2: #f0b457; --c3: #4fc9c2; --shadow: none; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.45; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num { text-align: right; white-space: nowrap; }
.muted { color: var(--muted); } .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.small { font-size: 12px; } .right { text-align: right; } .nowrap { white-space: nowrap; }

/* shell */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--navy); color: var(--navy-ink); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; padding-bottom: 12px; }
.brand { padding: 18px 18px 14px; border-bottom: 1px solid var(--navy-line); display: flex; gap: 10px; align-items: center; }
.brand .mark { width: 34px; height: 34px; border-radius: 6px; background: #fff; color: var(--navy); display: grid; place-items: center; font-weight: 600; letter-spacing: -.5px; flex: none; overflow: hidden; }
.brand .mark img { width: 100%; height: 100%; object-fit: contain; }
.brand b { color: #fff; font-weight: 600; letter-spacing: .06em; font-size: 13px; display: block; }
.brand span { font-size: 11px; color: var(--navy-ink); opacity: .8; }
.nav { padding: 8px 10px; display: flex; flex-direction: column; gap: 1px; }
.nav h6 { margin: 12px 8px 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--navy-ink); opacity: .6; font-weight: 500; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; color: var(--navy-ink); padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 13.5px; }
.nav button:hover { background: var(--navy-2); color: #fff; }
.nav button[aria-current="page"] { background: #fff; color: var(--navy); font-weight: 500; }
.nav svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 10px 24px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.top h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.top .sp { flex: 1; }
.top select { width: auto; padding: 5px 8px; }
.burger { display: none; }
.content { padding: 22px 24px 48px; max-width: 1480px; width: 100%; }

/* controls */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text); padding: 7px 13px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 13px; line-height: 1.2; white-space: nowrap; }
.btn:hover { background: var(--surface-2); border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: var(--bad); } .btn.danger:hover { background: var(--bad-soft); }
.btn.sm { padding: 4px 9px; font-size: 12px; } .btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
input, select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line-2); border-radius: 6px; padding: 7px 9px; min-width: 0; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: 2px solid var(--accent-soft); }
input[type=checkbox], input[type=radio] { width: auto; accent-color: var(--accent); }
textarea { resize: vertical; min-height: 60px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; }
label.f input, label.f select, label.f textarea { color: var(--text); font-weight: 400; font-size: 14px; }
label.f .req { color: var(--bad); }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-auto { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .row.sp { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); min-width: 0; }
.card > header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card > header h2 { font-size: 14px; margin: 0; font-weight: 600; }
.card .body { padding: 16px; } .card .scroll { overflow-x: auto; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.page-head h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.page-head p { margin: 2px 0 0; color: var(--muted); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 14px; color: var(--muted); cursor: pointer; font-weight: 500; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--accent); border-color: var(--accent); }
.search { max-width: 260px; }

/* tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-weight: 500; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--surface-2); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl tr.click { cursor: pointer; }
.tbl td.num, .tbl th.num { text-align: right; }
.tbl tfoot td { font-weight: 600; background: var(--surface-2); border-top: 2px solid var(--line-2); }
.tbl .cancelled td { opacity: .55; text-decoration: line-through; } .tbl .cancelled td:last-child, .tbl .cancelled td.keep { text-decoration: none; }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--text); margin-bottom: 4px; font-size: 15px; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 500; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); } .chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.gray { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }

/* kpis */
.kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 3px; }
.kpi .l { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 500; }
.kpi .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 21px; font-weight: 500; letter-spacing: -.02em; }
.kpi .s { font-size: 12px; color: var(--muted); }
.banner { border-radius: 10px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; justify-content: space-between; flex-wrap: wrap; }
.banner.good { background: var(--good-soft); color: var(--good); } .banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner b { font-size: 15px; }

/* modal / toast */
.scrim { position: fixed; inset: 0; background: rgba(8,14,32,.55); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 4vh 12px; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 12px; width: min(720px, 100%); box-shadow: 0 20px 60px rgba(0,0,0,.35); border: 1px solid var(--line); }
.modal.wide { width: min(1000px, 100%); } .modal.narrow { width: min(460px, 100%); }
.modal > header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal > header h3 { margin: 0; font-size: 16px; font-weight: 600; }
.modal .body { padding: 18px; } .modal > footer { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.x { background: none; border: 0; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); padding: 0 4px; }
#toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 200; display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--navy); color: #fff; padding: 10px 14px; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.3); font-size: 13px; border-left: 4px solid var(--c3); }
.toast.err { border-left-color: #ff6b61; }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 14px; font-size: 13px; }
.notice.info { background: var(--accent-soft); color: var(--accent); }

/* auth */
.auth { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: linear-gradient(160deg, var(--navy) 0 38%, var(--bg) 38%); }
.auth .card { width: min(460px, 100%); }
.auth h1 { margin: 0 0 2px; font-size: 22px; letter-spacing: .04em; }

/* doc builder */
.lines { width: 100%; border-collapse: collapse; min-width: 760px; }
.lines th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); text-align: left; padding: 6px; font-weight: 500; }
.lines td { padding: 4px 4px; vertical-align: middle; }
.lines input, .lines select { padding: 6px 7px; }
.lines .num input { text-align: right; font-family: var(--mono); }
.totals { display: grid; grid-template-columns: 1fr auto; gap: 6px 24px; font-size: 13.5px; }
.totals .gt { font-size: 17px; font-weight: 600; border-top: 2px solid var(--line-2); padding-top: 8px; margin-top: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; }
.seg label { padding: 6px 12px; cursor: pointer; border-right: 1px solid var(--line-2); font-size: 13px; }
.seg label:last-child { border-right: 0; } .seg input { display: none; }
.seg label:has(input:checked) { background: var(--accent); color: var(--accent-ink); }

/* invoice paper */
.paper { background: #fff; color: #111a33; border: 1px solid var(--line-2); border-radius: 4px; padding: 28px 30px; max-width: 880px; margin: 0 auto; font-size: 13px; }
.paper h3 { margin: 0; font-size: 20px; letter-spacing: .04em; }
.paper .tag { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #13244d; font-weight: 600; }
.paper table { width: 100%; border-collapse: collapse; margin-top: 14px; }
.paper th { background: #13244d; color: #fff; padding: 7px 8px; text-align: left; font-size: 11.5px; font-weight: 500; }
.paper td { padding: 7px 8px; border-bottom: 1px solid #dde3f0; }
.paper th.num, .paper td.num { text-align: right; }
.paper .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 16px; }
.paper .meta div { min-width: 0; overflow-wrap: anywhere; }
.paper .sum { margin-left: auto; width: min(320px, 100%); margin-top: 10px; }
.paper .sum div { display: flex; justify-content: space-between; padding: 3px 0; }
.paper .sum .gt { font-weight: 600; font-size: 15px; border-top: 2px solid #13244d; margin-top: 4px; padding-top: 6px; }
.paper .watermark { color: #b3261e; border: 2px solid #b3261e; display: inline-block; padding: 2px 10px; font-weight: 600; letter-spacing: .1em; transform: rotate(-4deg); }

/* charts */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--sans); }
.chart .grid-l { stroke: var(--line); stroke-width: 1; } .chart .axis { stroke: var(--line-2); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.hbar { display: grid; grid-template-columns: 130px 1fr 92px; gap: 10px; align-items: center; font-size: 12.5px; padding: 4px 0; }
.hbar .track { background: var(--surface-2); border-radius: 3px; height: 12px; overflow: hidden; } .hbar .fill { background: var(--c1); height: 100%; border-radius: 3px; }

@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 260px; z-index: 60; transform: translateX(-102%); transition: transform .18s; padding-top: env(safe-area-inset-top, 0px); }
  body.nav-open .side { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.4); }
  body.nav-open::after { content: ""; position: fixed; inset: 0; background: rgba(8,14,32,.45); z-index: 55; }
  body.nav-open .side { z-index: 70; }
  .burger { display: inline-flex; }
  .content { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
  .top { padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
}
@media (max-width: 640px) { .g2, .g3, .g4 { grid-template-columns: minmax(0, 1fr); } .kpi .v { font-size: 18px; } .hbar { grid-template-columns: 90px 1fr 80px; } .paper { padding: 16px; } .paper .meta { grid-template-columns: 1fr; } .top { gap: 8px; } .top h1 { font-size: 15px; flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .top .sp, .top .chip, .top .f .small { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  gstin: '', pan: '', aadhaar: '', udyam: '', tan: '', tradeLicense: '',
  bankName: '', accountNo: '', ifsc: '', branch: '', upi: '', logo: '',
  invPrefix: 'INV', invStart: 1, invPad: 4, invWithFY: true,
  terms: 'Goods once sold will not be taken back. Subject to local jurisdiction.', footer: 'Thank you for your business.',
  gstRates: [0, 5, 12, 18, 28], currency: 'INR', allowNegative: false,
});

function newDB() {
  const db = { v: 1, settings: SETTINGS_DEFAULT(), users: [], years: [], fy: null, accounts: [], parties: [], products: [], vouchers: [], counters: {}, audit: [], created: new Date().toISOString() };
  for (const [id, name, group] of SYS_ACCOUNTS) db.accounts.push({ id, name, group, sys: true });
  return db;
}

/* ---------- lookups ---------- */
const acc = (db, id) => db.accounts.find(a => a.id === id);
const prod = (db, id) => db.products.find(p => p.id === id);
const party = (db, id) => db.parties.find(p => p.id === id);
const nature = (db, id) => { const a = acc(db, id); return a ? GROUPS[a.group] : null; };
const isPL = (db, id) => { const n = nature(db, id); return n === 'I' || n === 'E'; };
const voucherLive = v => v.status !== 'cancelled';

/* ---------- financial years ---------- */
function yearRange(startYear) {
  const y = Number(startYear);
  return { id: `${y}-${String((y + 1) % 100).padStart(2, '0')}`, start: `${y}-04-01`, end: `${y + 1}-03-31`, locked: false };
}
function addYear(db, startYear) {
  const y = yearRange(startYear);
  if (!(y.start.slice(0, 4) >= 1990)) throw new Error('Enter a valid starting year, for example 2026.');
  if (db.years.some(x => x.id === y.id)) throw new Error(`Financial year ${y.id} already exists.`);
  db.years.push(y); db.years.sort((a, b) => a.start.localeCompare(b.start));
  if (!db.fy) db.fy = y.id;
  return y;
}
const getYear = (db, id) => db.years.find(y => y.id === (id || db.fy));
const fyOfDate = (db, date) => db.years.find(y => date >= y.start && date <= y.end);

/* ---------- transactions ---------- */
function run(db, fn) {
  const snap = JSON.stringify(db);
  try { return fn(); } catch (e) {
    const old = JSON.parse(snap);
    for (const k of Object.keys(db)) delete db[k];
    Object.assign(db, old);
    throw e;
  }
}
function audit(db, action, v, user, extra) {
  db.audit.push({ t: new Date().toISOString(), user: user || '', action, voucher: v ? v.no || v.id : '', type: v ? v.type : '', info: extra || '' });
  if (db.audit.length > 3000) db.audit.splice(0, db.audit.length - 3000);
}

/* ---------- validation ---------- */
const clean = s => String(s ?? '').trim();
function validateGSTIN(v) { v = clean(v).toUpperCase(); return !v || RX.gstin.test(v); }
function checkBusiness(s) {
  const errs = [];
  if (!clean(s.businessName)) errs.push('Business name is required.');
  if (s.gstin && !RX.gstin.test(clean(s.gstin).toUpperCase())) errs.push('GSTIN must be 15 characters, for example 27ABCDE1234F1Z5.');
  if (s.gstin && s.stateCode && clean(s.gstin).slice(0, 2) !== s.stateCode) errs.push('The first two digits of the GSTIN must match the state code.');
  if (s.pan && !RX.pan.test(clean(s.pan).toUpperCase())) errs.push('PAN must look like ABCDE1234F.');
  if (s.aadhaar && !RX.aadhaar.test(clean(s.aadhaar).replace(/\s/g, ''))) errs.push('Aadhaar must be 12 digits.');
  if (s.mobile && !RX.mobile.test(clean(s.mobile))) errs.push('Mobile number must be 10 digits.');
  if (s.email && !RX.email.test(clean(s.email))) errs.push('Email address is not valid.');
  if (s.ifsc && !RX.ifsc.test(clean(s.ifsc).toUpperCase())) errs.push('IFSC must look like SBIN0001234.');
  return errs;
}

/* ---------- parties ---------- */
function saveParty(db, p, user) {
  return run(db, () => {
    const name = clean(p.name);
    if (!name) throw new Error('Name is required.');
    if (!['customer', 'supplier'].includes(p.type)) throw new Error('Choose customer or supplier.');
    const gstin = clean(p.gstin).toUpperCase();
    if (gstin && !RX.gstin.test(gstin)) throw new Error('GSTIN is not valid.');
    if (clean(p.mobile) && !RX.mobile.test(clean(p.mobile))) throw new Error('Mobile number must be 10 digits.');
    const dup = db.parties.find(x => x.id !== p.id && x.type === p.type && x.name.toLowerCase() === name.toLowerCase());
    if (dup) throw new Error(`A ${p.type} named "${name}" already exists.`);
    if (gstin) {
      const d2 = db.parties.find(x => x.id !== p.id && x.type === p.type && x.gstin === gstin);
      if (d2) throw new Error(`GSTIN ${gstin} already belongs to ${d2.name}.`);
    }
    let rec = p.id && party(db, p.id);
    const stateCode = gstin ? gstin.slice(0, 2) : (p.stateCode || '');
    const data = { name, mobile: clean(p.mobile), address: clean(p.address), gstin, stateCode, state: STATES[stateCode] || clean(p.state), email: clean(p.email),
      opening: Math.abs(r2(num(p.opening))), openingType: p.openingType === 'Cr' ? 'Cr' : 'Dr' };
    if (rec) {
      Object.assign(rec, data);
      acc(db, rec.id).name = name;
    } else {
      rec = { id: uid('P'), type: p.type, ...data, created: new Date().toISOString() };
      db.parties.push(rec);
      db.accounts.push({ id: rec.id, name, group: p.type === 'customer' ? 'Sundry Debtors' : 'Sundry Creditors', party: true });
    }
    setOpening(db, 'acc', rec.id, rec.opening, rec.openingType);
    audit(db, p.id ? 'edit-party' : 'add-party', null, user, name);
    return rec;
  });
}
function deleteParty(db, id, user) {
  return run(db, () => {
    const used = db.vouchers.some(v => v.type !== 'opening' && (v.party === id || (v.entries || []).some(e => e.acc === id)));
    if (used) throw new Error('This party has transactions and cannot be deleted. Cancel its vouchers first, or leave it as is.');
    const p = party(db, id);
    db.vouchers = db.vouchers.filter(v => !(v.type === 'opening' && v.ref === id));
    db.parties = db.parties.filter(x => x.id !== id);
    db.accounts = db.accounts.filter(x => x.id !== id);
    audit(db, 'delete-party', null, user, p && p.name);
  });
}

/* ---------- ledger accounts ---------- */
function saveAccount(db, a, user) {
  return run(db, () => {
    const name = clean(a.name);
    if (!name) throw new Error('Ledger name is required.');
    if (!GROUPS[a.group]) throw new Error('Choose a valid group.');
    if (db.accounts.some(x => x.id !== a.id && x.name.toLowerCase() === name.toLowerCase())) throw new Error(`A ledger named "${name}" already exists.`);
    let rec = a.id && acc(db, a.id);
    if (rec) { if (!rec.sys) { rec.name = name; rec.group = a.group; } }
    else { rec = { id: uid('A'), name, group: a.group }; db.accounts.push(rec); }
    if (a.opening !== undefined) setOpening(db, 'acc', rec.id, Math.abs(r2(num(a.opening))), a.openingType === 'Cr' ? 'Cr' : 'Dr');
    audit(db, 'save-ledger', null, user, name);
    return rec;
  });
}

/* ---------- products ---------- */
function saveProduct(db, p, user) {
  return run(db, () => {
    const name = clean(p.name), code = clean(p.code);
    if (!name) throw new Error('Product name is required.');
    if (!code) throw new Error('Product code is required.');
    if (db.products.some(x => x.id !== p.id && x.code.toLowerCase() === code.toLowerCase())) throw new Error(`Product code "${code}" is already used.`);
    const bc = clean(p.barcode);
    if (bc && db.products.some(x => x.id !== p.id && x.barcode === bc)) throw new Error(`Barcode ${bc} is already assigned to another product.`);
    const buy = r2(num(p.buy)), sell = r2(num(p.sell));
    if (buy < 0 || sell < 0) throw new Error('Prices cannot be negative.');
    const gst = num(p.gst);
    if (!db.settings.gstRates.includes(gst)) throw new Error(`GST rate ${gst}% is not in your GST rate list.`);
    const data = { name, code, category: clean(p.category), brand: clean(p.brand), hsn: clean(p.hsn), unit: clean(p.unit) || 'Pcs', buy, sell, gst, min: Math.max(0, num(p.min)), barcode: bc };
    let rec = p.id && prod(db, p.id);
    if (rec) Object.assign(rec, data);
    else {
      rec = { id: uid('I'), ...data, qty: 0, value: 0, created: new Date().toISOString() };
      db.products.push(rec);
      const oq = r3(num(p.openQty));
      if (oq > 0) {
        const fy = getYear(db);
        postOpeningStock(db, rec, oq, r2(num(p.openRate) || buy), fy ? fy.start : todayISO());
      }
    }
    audit(db, p.id ? 'edit-product' : 'add-product', null, user, name);
    return rec;
  });
}
function postOpeningStock(db, rec, qty, rate, date) {
  const v = { id: uid('V'), type: 'opening', ref: 'stock:' + rec.id, date, fy: (fyOfDate(db, date) || {}).id || db.fy, no: 'OB', status: 'active', lines: [{ pid: rec.id, name: rec.name, qty, rate, taxable: r2(qty * rate) }], narr: 'Opening stock', created: new Date().toISOString() };
  applyStock(db, v);
  const cost = sum(v.lines, l => l.cost);
  v.entries = [{ acc: 'STOCK', dr: cost }, { acc: 'CAPITAL', cr: cost }];
  db.vouchers.push(v);
}
function deleteProduct(db, id, user) {
  return run(db, () => {
    const used = db.vouchers.some(v => v.type !== 'opening' && voucherLive(v) && (v.lines || []).some(l => l.pid === id));
    if (used) throw new Error('This product is used in vouchers and cannot be deleted.');
    const p = prod(db, id);
    const ov = db.vouchers.find(v => v.type === 'opening' && v.ref === 'stock:' + id);
    if (ov) { revertStock(db, ov); db.vouchers = db.vouchers.filter(v => v !== ov); }
    db.products = db.products.filter(x => x.id !== id);
    audit(db, 'delete-product', null, user, p && p.name);
  });
}

/* ---------- opening balances ---------- */
function setOpening(db, kind, id, amount, type) {
  db.vouchers = db.vouchers.filter(v => !(v.type === 'opening' && v.ref === kind + ':' + id));
  if (!(amount > 0)) return;
  const fy = getYear(db);
  const date = fy ? fy.start : todayISO();
  const e = type === 'Cr' ? [{ acc: 'CAPITAL', dr: amount }, { acc: id, cr: amount }] : [{ acc: id, dr: amount }, { acc: 'CAPITAL', cr: amount }];
  db.vouchers.push({ id: uid('V'), type: 'opening', ref: kind + ':' + id, date, fy: (fyOfDate(db, date) || {}).id || db.fy, no: 'OB', status: 'active', entries: e, narr: 'Opening balance', created: new Date().toISOString() });
}

/* ---------- stock mechanics ---------- */
const sum = (arr, f) => r2((arr || []).reduce((s, x) => s + (f ? f(x) : x), 0));
function unitCostOut(p, q) {
  if (p.qty <= 1e-9) return r2(q * p.buy);
  if (q >= p.qty - 1e-9) return r2(p.value);
  return r2(q * p.value / p.qty);
}
function applyStock(db, v) {
  for (const l of v.lines || []) {
    const p = prod(db, l.pid);
    if (!p) throw new Error(`Product "${l.name || l.pid}" no longer exists.`);
    const q = r3(l.qty);
    switch (v.type) {
      case 'sale': case 'debitnote': {
        if (q > p.qty + 1e-9 && !db.settings.allowNegative) throw new Error(`Not enough stock for ${p.name}: ${p.qty} in stock, ${q} requested.`);
        l.cost = unitCostOut(p, q); p.qty = r3(p.qty - q); p.value = r2(p.value - l.cost); break;
      }
      case 'purchase': case 'opening': l.cost = r2(l.taxable != null ? l.taxable : q * l.rate); p.qty = r3(p.qty + q); p.value = r2(p.value + l.cost); break;
      case 'creditnote': l.cost = l.unitCost != null ? r2(q * l.unitCost) : (p.qty > 1e-9 ? r2(q * p.value / p.qty) : r2(q * p.buy)); p.qty = r3(p.qty + q); p.value = r2(p.value + l.cost); break;
      case 'adjust':
        if (q >= 0) { l.cost = r2(q * l.rate); p.qty = r3(p.qty + q); p.value = r2(p.value + l.cost); }
        else { const o = -q; if (o > p.qty + 1e-9) throw new Error(`Cannot reduce ${p.name} by ${o}; only ${p.qty} in stock.`); l.cost = unitCostOut(p, o); p.qty = r3(p.qty - o); p.value = r2(p.value - l.cost); }
        break;
    }
  }
}
function revertStock(db, v) {
  for (const l of v.lines || []) {
    const p = prod(db, l.pid); if (!p) continue;
    const q = r3(l.qty);
    const outType = v.type === 'sale' || v.type === 'debitnote' || (v.type === 'adjust' && q < 0);
    const amt = Math.abs(q);
    if (outType) { p.qty = r3(p.qty + amt); p.value = r2(p.value + l.cost); }
    else {
      p.qty = r3(p.qty - amt); p.value = r2(p.value - l.cost);
      if (p.qty < -1e-9) throw new Error(`Cannot reverse this voucher: ${p.name} has already been sold or returned (${amt} needed, stock would go negative).`);
    }
  }
}

/* ---------- document totals ---------- */
function computeDoc(db, v) {
  const s = db.settings;
  let inter = false;
  if (v.party) { const p = party(db, v.party); if (p && p.stateCode && s.stateCode) inter = p.stateCode !== s.stateCode; }
  else if (v.placeCode && s.stateCode) inter = v.placeCode !== s.stateCode;
  v.inter = inter;
  let t = 0, cg = 0, sg = 0, ig = 0;
  for (const l of v.lines) {
    const p = prod(db, l.pid);
    l.name = p ? p.name : l.name; l.hsn = p ? p.hsn : l.hsn;
    l.qty = r3(num(l.qty)); l.rate = r2(num(l.rate)); l.disc = Math.min(100, Math.max(0, num(l.disc))); l.gst = num(l.gst);
    if (!(l.qty > 0) && v.type !== 'adjust') throw new Error(`Enter a quantity for ${l.name}.`);
    if (l.rate < 0) throw new Error('Rate cannot be negative.');
    const gross = l.qty * l.rate;
    l.taxable = r2(gross - gross * l.disc / 100);
    const g = r2(l.taxable * l.gst / 100);
    if (inter) { l.igst = g; l.cgst = 0; l.sgst = 0; } else { l.cgst = r2(g / 2); l.sgst = r2(g - l.cgst); l.igst = 0; }
    l.total = r2(l.taxable + l.cgst + l.sgst + l.igst);
    t += l.taxable; cg += l.cgst; sg += l.sgst; ig += l.igst;
  }
  v.taxable = r2(t); v.cgst = r2(cg); v.sgst = r2(sg); v.igst = r2(ig);
  const raw = r2(v.taxable + v.cgst + v.sgst + v.igst);
  v.round = r2(Math.round(raw) - raw);
  v.total = r2(raw + v.round);
}

/* ---------- ledger entries per voucher type ---------- */
function payAcc(db, v) {
  if (v.mode === 'cash') return 'CASH';
  const b = v.bankId && acc(db, v.bankId);
  if (b && b.group === 'Bank Accounts') return b.id;
  return 'BANK';
}
const E = (a, dr, cr, extra) => { const e = { acc: a }; if (dr) e.dr = r2(dr); if (cr) e.cr = r2(cr); return Object.assign(e, extra || {}); };
function rnd(round, posSide) { // positive rounding goes to posSide
  if (!round) return [];
  const amt = Math.abs(round);
  const dr = (round > 0) === (posSide === 'dr');
  return [E('ROUNDOFF', dr ? amt : 0, dr ? 0 : amt)];
}
function gstEntries(v, prefix, side) {
  const out = [];
  for (const [k, a] of [['cgst', 'CGST'], ['sgst', 'SGST'], ['igst', 'IGST']]) if (v[k] > 0) out.push(E(prefix + a, side === 'dr' ? v[k] : 0, side === 'cr' ? v[k] : 0));
  return out;
}
function buildEntries(db, v) {
  const cost = sum(v.lines, l => l.cost);
  let e = [];
  switch (v.type) {
    case 'sale': {
      const pa = payAcc(db, v);
      if (v.party) {
        e.push(E(v.party, v.total, 0));
      } else e.push(E(pa, v.total, 0));
      e.push(E('SALES', 0, v.taxable), ...gstEntries(v, 'OUT_', 'cr'), ...rnd(v.round, 'cr'));
      e.push(E('COGS', cost, 0), E('STOCK', 0, cost));
      if (v.party && v.paid > 0) e.push(E(pa, v.paid, 0, { settle: true }), E(v.party, 0, v.paid, { settle: true }));
      break;
    }
    case 'purchase': {
      const pa = payAcc(db, v);
      e.push(E('STOCK', v.taxable, 0), ...gstEntries(v, 'ITC_', 'dr'), ...rnd(v.round, 'dr'), E(v.party, 0, v.total));
      if (v.paid > 0) e.push(E(v.party, v.paid, 0, { settle: true }), E(pa, 0, v.paid, { settle: true }));
      break;
    }
    case 'creditnote':
      e.push(E('SALES_RET', v.taxable, 0), ...gstEntries(v, 'OUT_', 'dr'), ...rnd(v.round, 'dr'), E(v.party, 0, v.total), E('STOCK', cost, 0), E('COGS', 0, cost));
      break;
    case 'debitnote': {
      e.push(E(v.party, v.total, 0), E('STOCK', 0, cost), ...gstEntries(v, 'ITC_', 'cr'), ...rnd(v.round, 'cr'));
      const diff = r2(v.taxable - cost);
      if (diff > 0) e.push(E('STOCK_ADJ', 0, diff)); else if (diff < 0) e.push(E('STOCK_ADJ', -diff, 0));
      break;
    }
    case 'receipt': e.push(E(payAcc(db, v), v.amount, 0, { settle: true }), E(v.party, 0, v.amount, { settle: true })); break;
    case 'payment': e.push(E(v.party, v.amount, 0, { settle: true }), E(payAcc(db, v), 0, v.amount, { settle: true })); break;
    case 'contra': e.push(E(v.toAcc, v.amount, 0), E(v.fromAcc, 0, v.amount)); break;
    case 'expense': e.push(E(v.expAcc, v.amount, 0), E(payAcc(db, v), 0, v.amount)); break;
    case 'journal': e = (v.jlines || []).map(l => E(l.acc, l.dr, l.cr)); break;
    case 'adjust': {
      for (const l of v.lines) {
        if (l.qty >= 0) e.push(E('STOCK', l.cost, 0), E('STOCK_ADJ', 0, l.cost));
        else e.push(E('STOCK_ADJ', l.cost, 0), E('STOCK', 0, l.cost));
      }
      break;
    }
  }
  return e.filter(x => (x.dr || 0) > 0 || (x.cr || 0) > 0);
}
const balanced = e => Math.abs(r2(sum(e, x => x.dr || 0) - sum(e, x => x.cr || 0))) < 0.005;

/* ---------- numbering ---------- */
const PREFIX = { purchase: 'PUR', receipt: 'RCT', payment: 'PAY', contra: 'CON', journal: 'JV', expense: 'EXP', creditnote: 'CN', debitnote: 'DN', adjust: 'ADJ' };
function nextNo(db, type, fy) {
  const key = type + '|' + fy;
  const s = db.settings;
  const seqStart = type === 'sale' ? Math.max(1, Math.floor(num(s.invStart)) || 1) : 1;
  const n = (db.counters[key] || (seqStart - 1)) + 1;
  db.counters[key] = n;
  const prefix = type === 'sale' ? (clean(s.invPrefix) || 'INV') : PREFIX[type];
  const width = type === 'sale' ? Math.max(1, Math.floor(num(s.invPad)) || 4) : 4;
  const useFY = type === 'sale' ? s.invWithFY !== false : true;
  return useFY ? `${prefix}/${fy}/${pad(n, width)}` : `${prefix}/${pad(n, width)}`;
}

/* ---------- voucher validation ---------- */
function validateVoucher(db, v, oldId) {
  if (!v.date || !/^\d{4}-\d{2}-\d{2}$/.test(v.date)) throw new Error('Enter a valid date.');
  const fy = fyOfDate(db, v.date);
  if (!fy) throw new Error('This date is not inside any financial year. Add that financial year in Settings first.');
  if (fy.locked) throw new Error(`Financial year ${fy.id} is closed. Unlock it in Settings to post here.`);
  v.fy = fy.id;
  const docTypes = ['sale', 'purchase', 'creditnote', 'debitnote'];
  if (docTypes.includes(v.type)) {
    if (!v.lines || !v.lines.length) throw new Error('Add at least one product.');
    if (v.type !== 'sale' && !v.party) throw new Error('Select a ' + (v.type === 'purchase' || v.type === 'debitnote' ? 'supplier.' : 'customer.'));
    if (v.party) {
      const p = party(db, v.party); if (!p) throw new Error('The selected party no longer exists.');
      if ((v.type === 'purchase' || v.type === 'debitnote') && p.type !== 'supplier') throw new Error('Select a supplier.');
      if ((v.type === 'sale' || v.type === 'creditnote') && p.type !== 'customer') throw new Error('Select a customer.');
    }
    const seen = new Set();
    for (const l of v.lines) { if (!l.pid) throw new Error('Select a product on every line.'); }
    if (v.type === 'purchase') {
      const ref = clean(v.refNo);
      if (!ref) throw new Error("Enter the supplier's bill number.");
      const dup = db.vouchers.find(x => x.id !== oldId && x.type === 'purchase' && voucherLive(x) && x.party === v.party && clean(x.refNo).toLowerCase() === ref.toLowerCase());
      if (dup) throw new Error(`Bill ${ref} from this supplier is already recorded as ${dup.no}.`);
    }
  }
  if (['receipt', 'payment'].includes(v.type)) {
    v.amount = r2(num(v.amount));
    if (!(v.amount > 0)) throw new Error('Enter an amount greater than zero.');
    if (!party(db, v.party)) throw new Error('Select a party.');
    if (v.mode === 'credit') throw new Error('Choose cash, UPI or bank.');
  }
  if (v.type === 'expense') {
    v.amount = r2(num(v.amount));
    if (!(v.amount > 0)) throw new Error('Enter an amount greater than zero.');
    if (!acc(db, v.expAcc) || nature(db, v.expAcc) !== 'E') throw new Error('Select an expense category.');
  }
  if (v.type === 'contra') {
    v.amount = r2(num(v.amount));
    if (!(v.amount > 0)) throw new Error('Enter an amount greater than zero.');
    const ok = id => { const a = acc(db, id); return a && (a.group === 'Cash-in-Hand' || a.group === 'Bank Accounts'); };
    if (!ok(v.fromAcc) || !ok(v.toAcc)) throw new Error('Contra entries move money between cash and bank accounts.');
    if (v.fromAcc === v.toAcc) throw new Error('Choose two different accounts.');

/* ---------- charts ---------- */
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; }
function barChart(labels, series, o = {}) {
  const W = 680, H = 250, L = 52, R = 10, T = 12, B = 28, iw = W - L - R, ih = H - T - B;
  const all = series.flatMap(s => s.values); const max = niceMax(Math.max(...all, 0)), min = Math.min(...all, 0) < 0 ? -niceMax(-Math.min(...all)) : 0;
  const y = v => T + ih - (v - min) / (max - min) * ih; const gw = iw / labels.length, bw = Math.min(22, gw / (series.length + 1));
  let g = ''; for (let i = 0; i <= 4; i++) { const v = min + (max - min) * i / 4; g += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${compact(v)}</text>`; }
  let bars = '';
  labels.forEach((lb, i) => {
    const cx = L + gw * i + gw / 2; bars += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(lb)}</text>`;
    series.forEach((s, k) => { const v = s.values[i]; const x = cx - (series.length * bw) / 2 + k * bw; const y0 = y(0), y1 = y(v); bars += `<rect x="${x}" y="${Math.min(y0, y1)}" width="${bw - 2}" height="${Math.max(Math.abs(y1 - y0), v ? 1 : 0)}" rx="2" fill="${s.color}"><title>${esc(lb)} · ${esc(s.name)}: ${inr(v)}</title></rect>`; });
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'Bar chart')}">${g}<line class="axis" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>${bars}</svg>`;
}
function lineChart(labels, values, o = {}) {
  const W = 680, H = 230, L = 52, R = 14, T = 14, B = 28, iw = W - L - R, ih = H - T - B;
  const mx = Math.max(...values, 0), mn = Math.min(...values, 0); const max = mx > 0 ? niceMax(mx) : 1, min = mn < 0 ? -niceMax(-mn) : 0;
  const x = i => L + (labels.length === 1 ? iw / 2 : iw * i / (labels.length - 1)), y = v => T + ih - (v - min) / (max - min) * ih;
  let g = ''; for (let i = 0; i <= 4; i++) { const v = min + (max - min) * i / 4; g += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${compact(v)}</text>`; }
  const pts = values.map((v, i) => `${x(i)},${y(v)}`).join(' '); const area = `${x(0)},${y(0)} ${pts} ${x(values.length - 1)},${y(0)}`;
  const last = values.length - 1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'Line chart')}">${g}<line class="axis" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/><polygon points="${area}" fill="${o.color || 'var(--c1)'}" opacity=".12"/><polyline points="${pts}" fill="none" stroke="${o.color || 'var(--c1)'}" stroke-width="2"/>${values.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="${i === last ? 4 : 2.5}" fill="${o.color || 'var(--c1)'}"><title>${esc(labels[i])}: ${inr(v)}</title></circle>`).join('')}${labels.map((lb, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(lb)}</text>`).join('')}</svg>`;
}
function hbars(rows) { const mx = Math.max(...rows.map(r => r.amt), 1); return rows.map(r => `<div class="hbar"><span title="${esc(r.name)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span><div class="track"><div class="fill" style="width:${Math.max(2, r.amt / mx * 100)}%"></div></div><span class="num mono">${nf(r.amt)}</span></div>`).join(''); }

async function doSetup(f) {

function plRows(pl) {
  const r = [];
  const add = (h, a, bold) => r.push([h, a, bold ? 1 : 0]);
  add('Sales (excl. GST)', pl.salesGross); if (pl.salesRet) add('Less: Sales returns', -pl.salesRet); add('Net sales', pl.netSales, 1);
  pl.directInc.forEach(x => add(x.name, x.amt)); add('Less: Cost of goods sold', -pl.cogs); pl.directExp.forEach(x => add('Less: ' + x.name, -x.amt));
  add('Gross profit', pl.gross, 1);
  pl.indInc.forEach(x => add(x.name, x.amt)); pl.indExp.forEach(x => add('Less: ' + x.name, -x.amt));
  add(pl.netProfit >= 0 ? 'Net profit' : 'Net loss', pl.netProfit, 1);
  return r;
}

function bsRows(bs) {
  const L = [], A = [];
  const wanted = ['Capital Account', 'Loans (Liability)', 'Current Liabilities', 'Sundry Creditors', 'Duties & Taxes (Output)'];
  const gs = (list, order) => list.slice().sort((a, b) => order.indexOf(a.group) - order.indexOf(b.group));
  gs(bs.liabs, wanted).forEach(g => { L.push({ h: g.group, amt: g.total, head: 1 }); g.items.forEach(i => L.push({ h: i.name, amt: i.amt })); if (g.group === 'Capital Account') bs.extra.forEach(x => L.push({ h: x.name, amt: x.amt })); });
  if (!bs.liabs.find(g => g.group === 'Capital Account')) { L.unshift({ h: 'Capital Account', amt: 0, head: 1 }); bs.extra.forEach(x => L.splice(1, 0, { h: x.name, amt: x.amt })); }
  const aorder = ['Fixed Assets', 'Stock-in-Hand', 'Sundry Debtors', 'Cash-in-Hand', 'Bank Accounts', 'Duties & Taxes (Input)', 'Current Assets'];
  gs(bs.assets, aorder).forEach(g => { A.push({ h: g.group, amt: g.total, head: 1 }); g.items.forEach(i => A.push({ h: i.name, amt: i.amt })); });
  return { L, A };
}

  purchase: { t: 'Purchase Report', d: 'All purchase bills with supplier, GST and payment status.', p: 'range', build(f) {

  expense: { t: 'Expense Report', d: 'Expenses by category and by entry.', p: 'range', build(f) {

  bs: { t: 'Balance Sheet', d: 'Assets, liabilities and capital at year end.', p: 'fy', build() { const fy = E.getYear(db); const bs = E.balanceSheet(db, fy.id); const { L, A } = bsRows(bs); const n = Math.max(L.length, A.length); return { cols: [{ h: 'Liabilities & capital' }, { h: 'Amount', t: 'money' }, { h: 'Assets' }, { h: 'Amount', t: 'money' }], rows: Array.from({ length: n }, (_, i) => [L[i] ? L[i].h : '', L[i] ? L[i].amt : '', A[i] ? A[i].h : '', A[i] ? A[i].amt : '']), foot: ['Total', bs.totalLiab, 'Total', bs.totalAssets] }; } },

const FORMS = {
  async setup(f) { await doSetup(f); },
  async login(f) { await doLogin(f); },
  'set-business'(f) {
    const next = { ...S(), businessName: f.businessName.trim(), ownerName: f.ownerName.trim(), tradeType: f.tradeType.trim(), mobile: f.mobile.trim(), email: f.email.trim(), address: f.address.trim(), city: f.city.trim(), pincode: f.pincode.trim(), stateCode: f.stateCode, state: E.STATES[f.stateCode] || '' };
    const errs = E.checkBusiness(next); if (errs.length) return toast(errs[0], 'err');
    if (!f.stateCode) return toast('Choose your state. It decides CGST/SGST or IGST.', 'err');
    mutate(() => { db.settings = next; E.audit(db, 'settings', null, ui.user.name, 'business'); }, 'Business details saved.'); render();
  },
  'set-reg'(f) {
    const up = k => (f[k] || '').trim().toUpperCase(); const next = { ...S(), gstin: up('gstin'), pan: up('pan'), aadhaar: (f.aadhaar || '').replace(/\s/g, ''), udyam: f.udyam.trim(), tan: up('tan'), tradeLicense: f.tradeLicense.trim() };
    if (next.gstin && E.RX.gstin.test(next.gstin)) { next.stateCode = next.gstin.slice(0, 2); next.state = E.STATES[next.stateCode] || next.state; if (!E.STATES[next.stateCode]) return toast('The GSTIN starts with an unknown state code.', 'err'); }
    const errs = E.checkBusiness(next); if (errs.length) return toast(errs[0], 'err');
    mutate(() => { db.settings = next; E.audit(db, 'settings', null, ui.user.name, 'registrations'); }, 'Registrations saved.'); render();
  },
  'set-invoice'(f) {
    const rates = f.gstRates.split(',').map(x => x.trim()).filter(Boolean).map(Number);
    if (!rates.length || rates.some(r => !isFinite(r) || r < 0 || r > 100)) return toast('Enter GST rates as numbers, for example 0, 5, 12, 18, 28.', 'err');
    if (!f.invPrefix.trim()) return toast('Enter an invoice prefix.', 'err');
    const used = new Set(db.products.map(p => p.gst)); const missing = [...used].filter(r => !rates.includes(r)); if (missing.length) return toast(`Products still use ${missing.join('%, ')}%. Keep those rates in the list.`, 'err');
    mutate(() => { Object.assign(db.settings, { invPrefix: f.invPrefix.trim().toUpperCase(), invStart: Math.max(1, Math.floor(+f.invStart) || 1), invPad: Math.min(8, Math.max(1, Math.floor(+f.invPad) || 4)), invWithFY: !!f.invWithFY, gstRates: [...new Set(rates)].sort((a, b) => a - b), terms: f.terms, footer: f.footer, allowNegative: !!f.allowNegative }); E.audit(db, 'settings', null, ui.user.name, 'invoice'); }, 'Invoice settings saved.'); render();
  },
  'set-bank'(f) {
    const next = { ...S(), bankName: f.bankName.trim(), branch: f.branch.trim(), accountNo: f.accountNo.trim(), ifsc: (f.ifsc || '').trim().toUpperCase(), upi: f.upi.trim() };
    const errs = E.checkBusiness(next); if (errs.length) return toast(errs[0], 'err');
    if (next.upi && !/^[\w.\-]{2,}@[A-Za-z]{2,}$/.test(next.upi)) return toast('UPI ID should look like name@bank.', 'err');
    mutate(() => { db.settings = next; E.acc(db, 'BANK').name = next.bankName ? next.bankName + ' A/c' : 'Bank Account'; E.setOpening(db, 'acc', 'CASH', Math.abs(E.r2(+f.openCash || 0)), 'Dr'); E.setOpening(db, 'acc', 'BANK', Math.abs(E.r2(+f.openBank || 0)), 'Dr'); E.audit(db, 'settings', null, ui.user.name, 'bank'); }, 'Bank details saved.'); render();
  },
  'fy-add'(f) { if (mutate(() => E.addYear(db, +f.year || 0), 'Accounting year created.')) render(); },
};

function tryOpenParty(id) { ui.pid = id; go('party'); }
function downloadBackup() { saveFile(`${fileStem(S().businessName)}_backup_${E.todayISO()}.json`, JSON.stringify(db)); }
function validBackup(d) { return d && d.v === 1 && Array.isArray(d.vouchers) && Array.isArray(d.accounts) && Array.isArray(d.users) && Array.isArray(d.years) && d.settings && Array.isArray(d.products) && Array.isArray(d.parties); }
async function restoreText(text) {
  let d; try { d = JSON.parse(text); } catch (e) { return toast('That file is not a valid backup.', 'err'); }
  if (!validBackup(d)) return toast('That file is not a SHREE TRADERS backup.', 'err');
  const tb = d.vouchers.length; if (db && !(await confirmBox(`Restore this backup (${tb} entries, ${d.products.length} products, ${d.parties.length} parties)? Everything currently here will be replaced. You can undo this right after.`, 'Restore', true))) return;
  try { if (db) localStorage.setItem(KEY_PREV, JSON.stringify(db)); } catch (e) { }
  db = d; persist(); const u = db.users.find(x => ui.user && x.id === ui.user.id); ui.user = u || null; ui.f = {}; ui.draft = null; render(); toast('Backup restored.');
}
function checkTotalsAfterLoad() { try { const fy = E.getYear(db); return E.trialBalance(db, fy.id).ok; } catch (e) { return false; } }
const ACT = {
  nav(a) { ui.f.reports && (ui.f.reports.which = ''); go(a.dataset.page); },
  burger() { document.body.classList.toggle('nav-open'); },
  logout,
  lowstock() { ui.f.products = { ...(ui.f.products || {}), tab: 'items', low: true }; go('products'); },
  tab(a) { ui.f[a.dataset.key] = ui.f[a.dataset.key] || {}; ui.f[a.dataset.key].tab = a.dataset.v; render(); },
  'new-doc'(a) { const pre = a.dataset.party ? { party: a.dataset.party } : null; startDoc(a.dataset.type, null, pre); },
  'doc-cancel'() { const d = ui.draft; ui.draft = null; if (d && d.id) go('view', { vid: d.id }); else go(ui.from || 'dashboard'); },
  'doc-save': saveDoc,
  'add-line'() { ui.draft.lines.push({ pid: '', qty: 1, rate: 0, disc: 0, gst: S().gstRates.includes(18) ? 18 : S().gstRates[0] }); $('#lineBody').innerHTML = ui.draft.lines.map(lineRow).join(''); const sel = $$('#lineBody select[data-l$=".pid"]').pop(); if (sel) sel.focus(); },
  'del-line'(a) { ui.draft.lines.splice(+a.dataset.i, 1); $('#lineBody').innerHTML = ui.draft.lines.map(lineRow).join(''); refreshTotals(); },
  'quick-party'(a) { ui.afterParty = r => { ui.draft.party = r.id; render(); }; partyForm(a.dataset.ptype); },
  'view-voucher'(a) { ui.from = ui.from && PAGES[ui.page] && ui.page !== 'view' ? ui.page : (ui.from || 'dashboard'); if (ui.page !== 'view') ui.from = ui.page === 'doc' ? ui.from : ui.page; go('view', { vid: a.dataset.id }); },
  'edit-voucher'(a) { const v = db.vouchers.find(x => x.id === a.dataset.id); if (!v) return; if (DOC_TYPES.includes(v.type)) startDoc(v.type, v); else openVoucherForm(v.type, v); },
  'cancel-voucher'(a) {
    const v = db.vouchers.find(x => x.id === a.dataset.id); const extra = (v.type === 'sale' || v.type === 'purchase') && db.vouchers.some(x => x.against === v.id && x.status === 'active') ? '<p class="small warn">Receipts or notes linked to this entry will stay in the books as on-account amounts.</p>' : '';
    const sc = openModal('Cancel ' + TYPE_LABEL[v.type].toLowerCase() + ' ' + v.no, `<p style="margin-top:0">Cancelling reverses the ledger entries, stock and GST for this entry. The record stays in your history, marked as cancelled.</p>${extra}${field('Reason', `<input name="reason" placeholder="For example: wrong customer, duplicate entry">`)}`, { size: 'narrow', ok: 'Cancel entry' });
    sc._onSubmit = () => { const f = formData($('form', sc)); if (mutate(() => E.cancelVoucher(db, v.id, f.reason, ui.user.name), 'Entry cancelled. Books, stock and GST updated.')) { closeModal(sc); render(); } };
  },
  'invoice-pdf'(a) { const v = db.vouchers.find(x => x.id === a.dataset.id); if (v) invoicePDF(v); },
  'settle-invoice'(a) { const v = db.vouchers.find(x => x.id === a.dataset.id); const st = E.invoiceStatus(db, v); openVoucherForm(v.type === 'sale' ? 'receipt' : 'payment', null, { party: v.party, against: v.id, amount: st.balance }); },
  'voucher-form'(a) { openVoucherForm(a.dataset.type, null, a.dataset.party ? { party: a.dataset.party } : null); },
  'party-form'(a) { partyForm(a.dataset.ptype, a.dataset.id ? E.party(db, a.dataset.id) : null); },
  'open-party'(a) { tryOpenParty(a.dataset.id); },
  async 'delete-party'(a) { const p = E.party(db, a.dataset.id); if (await confirmBox(`Delete ${esc(p.name)}? This only works for parties with no transactions.`, 'Delete', true)) { if (mutate(() => E.deleteParty(db, p.id, ui.user.name), 'Party deleted.')) go('parties'); } },
  'product-form'(a) { productForm(a.dataset.id ? E.prod(db, a.dataset.id) : null); },
  async 'delete-product'(a) { const p = E.prod(db, a.dataset.id); if (await confirmBox(`Delete ${esc(p.name)}? This only works for products with no sales or purchases.`, 'Delete', true)) { if (mutate(() => E.deleteProduct(db, p.id, ui.user.name), 'Product deleted.')) render(); } },
  export(a) { exportRep(a.dataset.key, a.dataset.fmt); },
  'close-modal'() { closeModal(); },
  'modal-submit'(a) { const sc = a.closest('.scrim'); if (sc && sc._onSubmit) sc._onSubmit(); },
  'add-jrow'(a) { const sc = a.closest('.scrim'); $('#jBody', sc).insertAdjacentHTML('beforeend', jRow()); },
  'add-arow'(a) { const sc = a.closest('.scrim'); $('#aBody', sc).insertAdjacentHTML('beforeend', aRow()); },
  'del-row'(a) { const sc = a.closest('.scrim'); const tb = a.closest('tbody'); if (tb.children.length > 1) a.closest('tr').remove(); if (sc) jSum(sc); },
  'open-ledger'(a) { ui.accId = a.dataset.id; go('ledger'); },
  'ledger-form': ledgerForm,
  'open-report'(a) { ui.f.reports = ui.f.reports || { ...fyDef() }; ui.f.reports.which = a.dataset.id; render(); },
  'remove-logo'() { mutate(() => { db.settings.logo = ''; }, 'Logo removed.'); render(); },
  'fy-set'(a) { db.fy = a.dataset.id; persist(); ui.f = { settings: ui.f.settings }; render(); toast('Active year is now ' + db.fy); },
  async 'fy-lock'(a) { const y = E.getYear(db, a.dataset.id); const lock = !y.locked; if (lock && !(await confirmBox(`Close ${y.id}? No one can add, edit or cancel entries dated in this year until it is reopened.`, 'Close year'))) return; mutate(() => { y.locked = lock; E.audit(db, lock ? 'close-year' : 'reopen-year', null, ui.user.name, y.id); }, lock ? 'Year closed.' : 'Year reopened.'); render(); },
  'user-add'() {
    const sc = openModal('Add user', `<div class="grid g2">${field('Name', `<input name="name">`, { req: 1 })}${field('Username', `<input name="username">`, { req: 1 })}${field('Role', `<select name="role">${opts([['staff', 'Staff'], ['admin', 'Administrator']], 'staff')}</select>`)}${field('PIN (4 to 8 digits)', `<input name="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password">`, { req: 1 })}</div>`, { ok: 'Add user' });
    sc._onSubmit = async () => { const f = formData($('form', sc)); if (!f.name.trim() || !/^[A-Za-z0-9_.-]{3,20}$/.test(f.username.trim())) return toast('Enter a name and a username of 3 to 20 letters or digits.', 'err'); if (!/^\d{4,8}$/.test(f.pin)) return toast('PIN must be 4 to 8 digits.', 'err'); if (db.users.some(u => u.username.toLowerCase() === f.username.trim().toLowerCase())) return toast('That username is taken.', 'err'); const salt = E.uid('s'); const hash = await hashPin(f.pin, salt); mutate(() => { db.users.push({ id: E.uid('U'), name: f.name.trim(), username: f.username.trim(), role: f.role, salt, hash }); E.audit(db, 'add-user', null, ui.user.name, f.username); }, 'User added.'); closeModal(sc); render(); };
  },
  'user-pin'(a) {
    const u = db.users.find(x => x.id === a.dataset.id); const sc = openModal('Reset PIN for ' + u.name, field('New PIN (4 to 8 digits)', `<input name="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password">`), { size: 'narrow', ok: 'Set PIN' });
    sc._onSubmit = async () => { const f = formData($('form', sc)); if (!/^\d{4,8}$/.test(f.pin)) return toast('PIN must be 4 to 8 digits.', 'err'); const salt = E.uid('s'); const hash = await hashPin(f.pin, salt); mutate(() => { u.salt = salt; u.hash = hash; E.audit(db, 'reset-pin', null, ui.user.name, u.username); }, 'PIN updated.'); closeModal(sc); };
  },
  async 'user-del'(a) { const u = db.users.find(x => x.id === a.dataset.id); if (u.role === 'admin' && db.users.filter(x => x.role === 'admin').length < 2) return toast('You need at least one administrator.', 'err'); if (await confirmBox(`Remove ${esc(u.name)}?`, 'Remove', true)) { mutate(() => { db.users = db.users.filter(x => x.id !== u.id); }, 'User removed.'); render(); } },
  'backup-download': downloadBackup,
  async 'restore-prev'() { let raw = null; try { raw = localStorage.getItem(KEY_PREV); } catch (e) { } if (!raw) return; try { const d = JSON.parse(raw); if (!validBackup(d)) throw 0; const cur = JSON.stringify(db); db = d; persist(); try { localStorage.setItem(KEY_PREV, cur); } catch (e) { } ui.user = db.users.find(x => x.id === ui.user.id) || null; render(); toast('Previous data restored.'); } catch (e) { toast('Nothing to undo.', 'err'); } },
  async 'erase-data'() {
    const sc = openModal('Erase data', `<p style="margin-top:0">This removes every voucher, party, product and ledger you added. Business details, users and accounting years stay. A safety copy is kept so you can undo.</p>${field('Type ERASE to confirm', `<input name="c" autocomplete="off">`)}`, { size: 'narrow', ok: 'Erase', sticky: true });
    sc._onSubmit = () => { if (formData($('form', sc)).c.trim() !== 'ERASE') return toast('Type ERASE exactly to confirm.', 'err'); try { localStorage.setItem(KEY_PREV, JSON.stringify(db)); } catch (e) { } mutate(() => { db.vouchers = []; db.parties = []; db.products = []; db.accounts = db.accounts.filter(a => a.sys); db.counters = {}; db.audit = []; }, 'All transaction data erased.'); closeModal(sc); ui.f = {}; go('dashboard'); };
  },
  async 'load-sample'() {
    if (db.vouchers.some(v => v.type !== 'opening')) return toast('Sample data can only be loaded into empty books.', 'err');
    if (!(await confirmBox('Load sample parties, products and transactions? They are clearly named "Sample" and can be erased in Settings.', 'Load sample data'))) return;
    const ok = mutate(() => E.run(db, () => { seedSample(E, db, ui.user.name); }), 'Sample data loaded. Explore every section.'); if (ok) { ui.f = {}; go('dashboard'); }
  },
};
function pageChange(el) {
  if (el.dataset.f) {
    const [k, p] = el.dataset.f.split('.'); ui.f[k] = ui.f[k] || {}; ui.f[k][p] = el.type === 'checkbox' ? el.checked : el.value;
    if (k === 'bsheet' && p === 'on' && !el.value) return; render(); return;
  }
  const act = el.dataset.actChange;
  if (act === 'set-fy') { db.fy = el.value; persist(); const keep = { settings: ui.f.settings }; ui.f = keep; render(); }
  else if (act === 'restore-file') { const file = el.files && el.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => restoreText(String(r.result)); r.readAsText(file); el.value = ''; }
  else if (act === 'logo-file') {
    const file = el.files && el.files[0]; if (!file) return; if (file.size > 2e6) return toast('Choose an image under 2 MB.', 'err');
    const r = new FileReader(); r.onload = () => { const img = new Image(); img.onload = () => { const m = 240, sc = Math.min(1, m / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); mutate(() => { db.settings.logo = c.toDataURL('image/png'); }, 'Logo saved.'); render(); }; img.onerror = () => toast('That image could not be read.', 'err'); img.src = r.result; }; r.readAsDataURL(file);
  }
  else if (el.dataset.agp) {
    const type = el.dataset.agp; const sel = $('#againstSel2', el.closest('form')); if (!sel) return; const invs = el.value ? openInvoicesFor(el.value, type === 'receipt' ? 'sale' : 'purchase') : [];
    sel.innerHTML = opts(invs.map(r => [r.v.id, `${r.v.no} · balance ${nf(r.st.balance)}`]), '', 'On account / not linked');
  }
  else if (el.id === 'againstSel2' && el.value) { const v = db.vouchers.find(x => x.id === el.value); if (v) { const amt = $('#vAmt', el.closest('form')); if (amt && !E.num(amt.value)) amt.value = E.invoiceStatus(db, v).balance; } }
}

/* ---------- event wiring & boot ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return; const fn = ACT[a.dataset.act]; if (!fn) return;
  if (a.tagName === 'A' && a.getAttribute('href') && a.getAttribute('href').startsWith('#')) e.preventDefault();
  if (a.closest('.scrim') && ['cf-yes', 'cf-no'].includes(a.dataset.act)) return;
  fn(a, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.filter) return applyFilter(el);
  if (el.matches('[data-jsum]')) { const sc = el.closest('.scrim'); if (sc) jSum(sc); return; }
  if ((el.dataset.d || el.dataset.l) && el.tagName === 'INPUT' && el.type !== 'radio' && el.type !== 'date') docInput(el);
});
document.addEventListener('change', e => {
  const el = e.target;
  if ((el.dataset.d || el.dataset.l) && (el.tagName !== 'INPUT' || el.type === 'radio' || el.type === 'date')) return docInput(el);
  if (el.dataset.f || el.dataset.actChange || el.dataset.agp || el.id === 'againstSel2') pageChange(el);
});
document.addEventListener('submit', async e => {
  e.preventDefault(); const form = e.target; const sc = form.closest('.scrim');
  if (sc) { if (sc._onSubmit) sc._onSubmit(); return; }
  const name = form.dataset.form; if (!FORMS[name]) return; const btnEl = form.querySelector('[type=submit]'); if (btnEl) btnEl.disabled = true;
  try { await FORMS[name](formData(form)); } finally { if (btnEl && document.body.contains(btnEl)) btnEl.disabled = false; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalStack.length) { const sc = modalStack[modalStack.length - 1]; if (!sc.querySelector('[data-act=cf-yes]')) closeModal(); }
  if (e.target.id === 'scan' && e.key === 'Enter') {
    e.preventDefault(); const q = e.target.value.trim().toLowerCase(); if (!q) return;
    const p = db.products.find(x => (x.barcode && x.barcode.toLowerCase() === q) || x.code.toLowerCase() === q);
    if (p) { addLineByProduct(p, 1); e.target.value = ''; } else toast(`No product with barcode or code "${e.target.value.trim()}".`, 'err');
  }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && PAGES[h] && !['doc', 'view', 'party', 'ledger'].includes(h) && h !== ui.page && ui.user) { ui.page = h; render(); } });

(function boot() {
  db = loadDB();
  if (db) {
    try { const sid = sessionStorage.getItem(SESS); if (sid) ui.user = db.users.find(u => u.id === sid) || null; } catch (e) { }
    if (!db.years.length) E.addYear(db, fyStartDefault());
    if (!E.getYear(db)) db.fy = db.years[0].id;
    const h = location.hash.slice(1); if (h && PAGES[h] && !['doc', 'view', 'party', 'ledger'].includes(h)) ui.page = h;
  } else { try { localStorage.setItem('shree_probe', '1'); localStorage.removeItem('shree_probe'); } catch (e) { ui.storageOk = false; } }
  render();
})();
</script>
